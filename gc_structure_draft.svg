<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" font-family="'WenQuanYi Zen Hei','Malgun Gothic',sans-serif">
<defs>
 <marker id="aB" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 z" fill="#2b7cd3"/></marker>
 <marker id="aR" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 z" fill="#d9534f"/></marker>
 <radialGradient id="fl" cx="50%" cy="70%" r="60%"><stop offset="0" stop-color="#fff2a8"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#e4572e"/></radialGradient>
</defs>
<rect width="1280" height="820" fill="#fff"/>
<text x="40" y="42" font-size="25" font-weight="bold" fill="#222">Agilent 8890 GC 내부 구조 (개념도)</text>
<line x1="40" y1="54" x2="520" y2="54" stroke="#d9534f" stroke-width="3"/>
<g font-size="13" fill="#444">
 <line x1="40" y1="76" x2="80" y2="76" stroke="#444" stroke-width="3"/><text x="88" y="81">컬럼 (시료가 지나가는 길)</text>
 <line x1="300" y1="76" x2="340" y2="76" stroke="#2b7cd3" stroke-width="3" marker-end="url(#aB)"/><text x="352" y="81">가스 흐름</text>
 <rect x="460" y="64" width="86" height="22" rx="11" fill="#d9534f"/><text x="503" y="80" fill="#fff" text-anchor="middle" font-size="12">Empower 값</text>
</g>

<!-- ===== INLET ===== -->
<text x="316" y="142" font-size="15" font-weight="bold" fill="#333">INLET · Back SSL 주입구 (슬라이드 1)</text>
<rect x="190" y="150" width="240" height="190" rx="10" fill="#fff3e8" stroke="#e8a33d" stroke-width="2.5"/>
<rect x="340" y="158" width="82" height="22" rx="11" fill="#d9534f"/><text x="381" y="173" fill="#fff" text-anchor="middle" font-size="12">Heater 140 °C</text>
<!-- HS transfer line -->
<line x1="300" y1="92" x2="300" y2="182" stroke="#444" stroke-width="12"/><line x1="300" y1="92" x2="300" y2="182" stroke="#f5b97a" stroke-width="6" stroke-dasharray="3 3"/>
<line x1="300" y1="182" x2="300" y2="262" stroke="#d9534f" stroke-width="2.5"/>
<rect x="272" y="160" width="56" height="22" rx="4" fill="#9aa5b1" stroke="#6f7b88" stroke-width="2"/>
<rect x="278" y="182" width="44" height="8" fill="#333"/>
<text x="266" y="176" text-anchor="end" font-size="11" fill="#555">Septum nut</text>
<text x="266" y="216" text-anchor="end" font-size="11" fill="#555">Septum</text>
<text x="318" y="106" font-size="12" fill="#444" font-weight="bold">7697A 트랜스퍼 라인</text>
<text x="318" y="121" font-size="11" fill="#666">septum nut으로 고정, 끝은 liner 안 (매뉴얼 p.50)</text>
<!-- liner -->
<rect x="275" y="200" width="50" height="120" rx="5" fill="#fff" stroke="#6f8196" stroke-width="2.5"/>
<text x="338" y="262" font-size="12" fill="#445">Liner (기화실)</text>
<!-- septum purge -->
<path d="M275,196 L60,196" fill="none" stroke="#2b7cd3" stroke-width="3" marker-end="url(#aB)"/>
<text x="30" y="186" font-size="12" fill="#2b7cd3" font-weight="bold">Septum purge 배기 (2~5 mL/min)</text>
<!-- carrier in -->
<path d="M60,262 L275,262" fill="none" stroke="#2b7cd3" stroke-width="3" marker-end="url(#aB)"/>
<text x="30" y="252" font-size="12" fill="#2b7cd3" font-weight="bold">캐리어 가스 (EPC 압력/유량)</text>
<!-- split vent -->
<path d="M325,305 L500,305" fill="none" stroke="#2b7cd3" stroke-width="3" marker-end="url(#aB)"/>
<text x="440" y="296" font-size="12" fill="#2b7cd3" font-weight="bold">Split vent</text>
<rect x="440" y="314" width="70" height="20" rx="10" fill="#d9534f"/><text x="475" y="328" fill="#fff" text-anchor="middle" font-size="11">Split 5:1</text>

<!-- ===== OVEN ===== -->
<text x="60" y="372" font-size="15" font-weight="bold" fill="#333">OVEN · 컬럼 오븐 (슬라이드 2~5)</text>
<rect x="60" y="380" width="840" height="360" rx="10" fill="#f4f8fd" stroke="#2b7cd3" stroke-width="2.5"/>
<rect x="72" y="392" width="200" height="22" rx="11" fill="#d9534f"/><text x="172" y="407" fill="#fff" text-anchor="middle" font-size="12">40 °C → 10 °C/min → 240 °C</text>
<g fill="none" stroke="#555" stroke-width="3">
 <ellipse cx="520" cy="570" rx="230" ry="130"/><ellipse cx="520" cy="570" rx="190" ry="104"/><ellipse cx="520" cy="570" rx="150" ry="78"/><ellipse cx="520" cy="570" rx="110" ry="52"/>
 <path d="M300,320 L300,430 C300,500 290,520 290,570"/>
 <path d="M750,570 L1000,570"/>
</g>
<text x="520" y="566" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">컬럼</text>
<text x="520" y="583" text-anchor="middle" font-size="11" fill="#555">30 m × 320 µm × 1.8 µm</text>
<circle cx="830" cy="685" r="30" fill="#fff" stroke="#2b7cd3" stroke-width="2.5"/>
<g stroke="#2b7cd3" stroke-width="4" stroke-linecap="round"><line x1="830" y1="685" x2="830" y2="660"/><line x1="830" y1="685" x2="855" y2="685"/><line x1="830" y1="685" x2="830" y2="710"/><line x1="830" y1="685" x2="805" y2="685"/></g>
<text x="830" y="730" text-anchor="middle" font-size="11" fill="#2b6fb0">오븐 팬 · 히터</text>
<text x="100" y="640" font-size="11" fill="#666">오븐 공기가 컬럼 전체를 고르게 가열</text>
<text x="100" y="656" font-size="11" fill="#666">(Max Oven 280 °C, Equilibration Time 후 시작)</text>

<!-- ===== OUTLET / DETECTOR ===== -->
<text x="950" y="292" font-size="15" font-weight="bold" fill="#333">OUTLET · 검출기 Front FID (슬라이드 6)</text>
<rect x="950" y="300" width="280" height="400" rx="10" fill="#f3f6f9" stroke="#8fa3b5" stroke-width="2.5"/>
<rect x="962" y="310" width="96" height="22" rx="11" fill="#d9534f"/><text x="1010" y="325" fill="#fff" text-anchor="middle" font-size="12">Heater 250 °C</text>
<!-- jet -->
<rect x="1075" y="500" width="20" height="120" fill="#fff" stroke="#6f8196" stroke-width="2.5"/>
<ellipse cx="1085" cy="478" rx="15" ry="28" fill="url(#fl)"/>
<rect x="1050" y="360" width="70" height="112" fill="none" stroke="#2b7cd3" stroke-width="3" stroke-dasharray="0"/>
<text x="1128" y="395" font-size="12" fill="#2b6fb0" font-weight="bold">수집 전극</text><text x="1128" y="410" font-size="11" fill="#2b6fb0">(Collector)</text>
<text x="1128" y="488" font-size="12" fill="#b8651a" font-weight="bold">수소 불꽃</text>
<line x1="1085" y1="360" x2="1085" y2="338" stroke="#2b7cd3" stroke-width="2.5"/><line x1="1085" y1="338" x2="1262" y2="338" stroke="#d9534f" stroke-width="2.5" marker-end="url(#aR)"/>
<text x="1235" y="330" text-anchor="end" font-size="12" fill="#d9534f" font-weight="bold">신호 → Empower</text>
<!-- column effluent -->
<path d="M1000,570 L1000,600 L1085,600 L1085,620" fill="none" stroke="#555" stroke-width="3"/>
<text x="962" y="560" font-size="11" fill="#555">컬럼 용출액</text>
<!-- gases -->
<path d="M1030,700 L1030,604" fill="none" stroke="#2b7cd3" stroke-width="3" marker-end="url(#aB)"/>
<path d="M1085,700 L1085,632" fill="none" stroke="#2b7cd3" stroke-width="3" marker-end="url(#aB)"/>
<path d="M1175,700 L1175,545 L1125,545" fill="none" stroke="#2b7cd3" stroke-width="3" marker-end="url(#aB)"/>
<g font-size="11" font-weight="bold" fill="#2b7cd3" text-anchor="middle">
 <text x="1018" y="722">Makeup N2</text><text x="1085" y="738">H2 연료</text><text x="1175" y="722">Air</text></g>
<g font-size="11" fill="#d9534f" text-anchor="middle"><text x="1018" y="737">25 mL/min</text><text x="1085" y="753">40 mL/min</text><text x="1175" y="737">400 mL/min</text></g>
<path d="M1190,430 L1190,365" fill="none" stroke="#2b7cd3" stroke-width="3" marker-end="url(#aB)"/><text x="1190" y="355" text-anchor="middle" font-size="11" fill="#2b7cd3" font-weight="bold">배기</text>

<text x="40" y="790" font-size="11" fill="#666">※ 8890 매뉴얼을 확인하지 못해 일반적인 SSL 주입구 / 오븐 / FID 구조로 그린 개념도입니다. 트랜스퍼 라인 연결부만 7697A 정비 매뉴얼(G4556-90017) p.50 기준입니다.</text>
<text x="40" y="806" font-size="11" fill="#666">Empower 값(140 °C, 5:1, 40→240 °C, 250 °C, 25/40/400 mL/min)은 gc_headspace.html의 현재 설정값입니다.</text>
</svg>
