<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'WenQuanYi Zen Hei','Malgun Gothic',sans-serif">
<defs>
  <marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b7cd3"/></marker>
  <marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9534f"/></marker>
</defs>
<rect width="1280" height="800" fill="#ffffff"/>

<!-- title -->
<text x="60" y="42" font-size="25" font-weight="bold" fill="#222">Agilent 7697A 헤드스페이스 내부 구조 (개념도)</text>
<line x1="60" y1="54" x2="520" y2="54" stroke="#d9534f" stroke-width="3"/>
<!-- legend -->
<g font-size="13" fill="#444">
  <line x1="60" y1="76" x2="100" y2="76" stroke="#2b7cd3" stroke-width="3" stroke-dasharray="7 4"/><text x="108" y="81">③ 루프 채움 경로</text>
  <line x1="250" y1="76" x2="290" y2="76" stroke="#d9534f" stroke-width="3"/><text x="298" y="81">④ 주입 경로</text>
  <line x1="410" y1="76" x2="450" y2="76" stroke="#7b3fb0" stroke-width="5"/><text x="458" y="81">샘플 루프</text>
  <rect x="560" y="64" width="86" height="22" rx="11" fill="#d9534f"/><text x="603" y="80" fill="#fff" text-anchor="middle" font-size="12">Empower 값</text>
</g>
<!-- temp order banner -->
<rect x="830" y="22" width="410" height="52" rx="8" fill="#fff0f0" stroke="#ffcccc"/>
<text x="1035" y="42" text-anchor="middle" font-size="13" fill="#d9534f" font-weight="bold">온도 순서 (슬라이드 10)</text>
<text x="1035" y="62" text-anchor="middle" font-size="15" fill="#222">Oven ≤ Loop/Valve ≤ Transfer Line</text>

<!-- ===== boxes ===== -->
<text x="60" y="132" font-size="15" font-weight="bold" fill="#333">① 바이알 오븐 (Vial Oven)</text>
<rect x="60" y="140" width="340" height="360" rx="10" fill="#fdf6ee" stroke="#e8a33d" stroke-width="2.5"/>
<rect x="296" y="150" width="96" height="22" rx="11" fill="#d9534f"/><text x="344" y="165" fill="#fff" text-anchor="middle" font-size="12">Oven 85 °C</text>

<text x="500" y="132" font-size="15" font-weight="bold" fill="#333">밸브 &amp; 루프 오븐 (Valve / Loop)</text>
<rect x="500" y="140" width="310" height="380" rx="10" fill="#f6f2fb" stroke="#b79ad6" stroke-width="2.5"/>
<rect x="706" y="150" width="96" height="22" rx="11" fill="#d9534f"/><text x="754" y="165" fill="#fff" text-anchor="middle" font-size="12">Loop 105 °C</text>

<text x="960" y="132" font-size="15" font-weight="bold" fill="#333">GC 8890</text>
<rect x="960" y="140" width="280" height="360" rx="10" fill="#f3f6f9" stroke="#8fa3b5" stroke-width="2.5"/>

<!-- ===== vial oven content ===== -->
<rect x="70" y="478" width="320" height="16" rx="4" fill="#c9c9c9"/>
<text x="230" y="490" font-size="11" fill="#555" text-anchor="middle">트레이 / 가열 블록</text>
<!-- vial 1 -->
<rect x="85" y="300" width="90" height="178" rx="10" fill="#fffbea" stroke="#555" stroke-width="2.5"/>
<rect x="87" y="395" width="86" height="81" rx="8" fill="#bfe3f7"/>
<g fill="#e8a33d" opacity=".75"><circle cx="105" cy="330" r="3"/><circle cx="130" cy="350" r="3"/><circle cx="150" cy="322" r="3"/><circle cx="120" cy="375" r="3"/><circle cx="155" cy="370" r="3"/><circle cx="100" cy="355" r="2.5"/></g>
<rect x="110" y="282" width="40" height="20" fill="#fffbea" stroke="#555" stroke-width="2.5"/>
<rect x="104" y="272" width="52" height="14" rx="3" fill="#444"/>
<!-- vial 2 faint -->
<g opacity=".35"><rect x="295" y="300" width="90" height="178" rx="10" fill="#fffbea" stroke="#555" stroke-width="2.5"/>
<rect x="297" y="410" width="86" height="66" rx="8" fill="#bfe3f7"/>
<rect x="320" y="282" width="40" height="20" fill="#fffbea" stroke="#555" stroke-width="2.5"/><rect x="314" y="272" width="52" height="14" rx="3" fill="#444"/></g>
<!-- labels vial -->
<text x="182" y="335" font-size="13" fill="#9a6a10" font-weight="bold">헤드스페이스</text>
<text x="182" y="351" font-size="13" fill="#9a6a10" font-weight="bold">(기체)</text>
<text x="182" y="440" font-size="13" fill="#1d6fa5" font-weight="bold">시료 (액체)</text>
<text x="182" y="216" font-size="12" fill="#555">12 / 111 바이알</text>
<text x="182" y="232" font-size="12" fill="#555">진탕(Shaking) 지원</text>
<path d="M62,396 l-0,0" />
<text x="72" y="416" font-size="18" fill="#e8a33d">⇆</text>
<!-- probe tubing + needle -->
<path d="M130,350 L130,108 L450,108 L450,330 L565,330" fill="none" stroke="#2b7cd3" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#aB)"/>
<rect x="127.5" y="140" width="5" height="212" fill="#666"/>
<polygon points="127.5,352 132.5,352 130,362" fill="#666"/>
<text x="250" y="102" font-size="13" fill="#2b7cd3" font-weight="bold">샘플링 프로브 → 시료 가스</text>
<text x="140" y="262" font-size="11" fill="#666">프로브 끝이 기체 영역에 위치</text>
<line x1="136" y1="266" x2="131" y2="340" stroke="#aaa" stroke-width="1"/>

<!-- ===== valve ===== -->
<g stroke="#7b3fb0" stroke-width="3.5" fill="none">
  <line x1="622.5" y1="282.4" x2="607.5" y2="256.4"/>
  <line x1="677.5" y1="282.4" x2="692.5" y2="256.4"/>
  <line x1="705" y1="330" x2="735" y2="330"/>
  <line x1="677.5" y1="377.6" x2="692.5" y2="403.6"/>
  <line x1="622.5" y1="377.6" x2="607.5" y2="403.6"/>
  <line x1="595" y1="330" x2="565" y2="330"/>
</g>
<circle cx="650" cy="330" r="55" fill="#ede5f7" stroke="#7b3fb0" stroke-width="3.5"/>
<text x="650" y="326" text-anchor="middle" font-size="13" fill="#4a2a73" font-weight="bold">6포트</text>
<text x="650" y="344" text-anchor="middle" font-size="13" fill="#4a2a73" font-weight="bold">밸브</text>
<g fill="#7b3fb0"><circle cx="607.5" cy="256.4" r="5"/><circle cx="692.5" cy="256.4" r="5"/><circle cx="692.5" cy="403.6" r="5"/><circle cx="607.5" cy="403.6" r="5"/></g>
<!-- loop -->
<path d="M607.5,256.4 C585,160 715,160 692.5,256.4" fill="none" stroke="#7b3fb0" stroke-width="6" stroke-linecap="round"/>
<text x="650" y="228" text-anchor="middle" font-size="13" fill="#4a2a73" font-weight="bold">샘플 루프</text>
<text x="650" y="243" text-anchor="middle" font-size="10" fill="#4a2a73">(Sample Loop)</text>

<!-- carrier in -->
<path d="M390,560 L607.5,560 L607.5,412" fill="none" stroke="#d9534f" stroke-width="3" marker-end="url(#aR)"/>
<text x="384" y="565" text-anchor="end" font-size="13" fill="#d9534f" font-weight="bold">캐리어 가스 (GC EPC)</text>
<!-- vent -->
<path d="M692.5,412 L692.5,560" fill="none" stroke="#2b7cd3" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#aB)"/>
<text x="692.5" y="582" text-anchor="middle" font-size="13" fill="#2b7cd3" font-weight="bold">Vent (배기)</text>

<!-- ===== transfer line ===== -->
<line x1="735" y1="330" x2="1010" y2="330" stroke="#444" stroke-width="13"/>
<line x1="735" y1="330" x2="1010" y2="330" stroke="#f5b97a" stroke-width="7" stroke-dasharray="3 3"/>
<line x1="760" y1="330" x2="1000" y2="330" stroke="#d9534f" stroke-width="2.5" marker-end="url(#aR)"/>
<text x="885" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">② 트랜스퍼 라인</text>
<text x="885" y="318" text-anchor="middle" font-size="11" fill="#555">(Transfer Line · 가열 이송관)</text>
<rect x="827" y="352" width="116" height="22" rx="11" fill="#d9534f"/><text x="885" y="367" fill="#fff" text-anchor="middle" font-size="12">Transfer 105 °C</text>
<text x="885" y="392" text-anchor="middle" font-size="11" fill="#555">응축 방지를 위해 가장 뜨겁게</text>

<!-- ===== GC inlet ===== -->
<rect x="1010" y="205" width="190" height="150" rx="8" fill="#e6ecf2" stroke="#8fa3b5" stroke-width="2"/>
<text x="1105" y="198" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">GC 주입구 (SSL)</text>
<rect x="1085" y="225" width="40" height="110" rx="4" fill="#fff" stroke="#6f8196" stroke-width="2"/>
<text x="1105" y="285" text-anchor="middle" font-size="12" fill="#445" transform="rotate(-90 1105 285)">Liner</text>
<line x1="1010" y1="330" x2="1085" y2="330" stroke="#d9534f" stroke-width="2.5"/>
<line x1="1105" y1="335" x2="1105" y2="400" stroke="#555" stroke-width="3"/>
<ellipse cx="1105" cy="430" rx="55" ry="22" fill="none" stroke="#555" stroke-width="3"/>
<ellipse cx="1105" cy="430" rx="38" ry="14" fill="none" stroke="#555" stroke-width="3"/>
<text x="1105" y="472" text-anchor="middle" font-size="12" fill="#445">컬럼 (GC 오븐 안) → FID 검출기</text>

<!-- ===== steps ===== -->
<g font-size="13">
<rect x="40" y="610" width="285" height="150" rx="10" fill="#fdf6ee" stroke="#e8a33d"/>
<circle cx="66" cy="636" r="13" fill="#e8a33d"/><text x="66" y="641" text-anchor="middle" fill="#fff" font-weight="bold">1</text>
<text x="88" y="641" font-weight="bold" font-size="15">바이알 평형</text>
<text x="55" y="670" fill="#444">바이알 오븐 85 °C에서 가열·진탕</text>
<text x="55" y="690" fill="#444">→ 성분이 액체 ⇄ 기체(헤드스페이스)</text>
<text x="55" y="710" fill="#444">   로 평형 도달 (Equilibration 45분)</text>
<text x="55" y="738" fill="#d9534f" font-size="12">Empower: Times / Temperatures</text>

<rect x="345" y="610" width="285" height="150" rx="10" fill="#f4f8fd" stroke="#2b7cd3"/>
<circle cx="371" cy="636" r="13" fill="#2b7cd3"/><text x="371" y="641" text-anchor="middle" fill="#fff" font-weight="bold">2</text>
<text x="393" y="641" font-weight="bold" font-size="15">가압 (Pressurize)</text>
<text x="360" y="670" fill="#444">프로브가 바이알을 뚫고 들어가</text>
<text x="360" y="690" fill="#444">캐리어로 가압 → 평형 압력보다</text>
<text x="360" y="710" fill="#444">높게 (Fill 압력 설정)</text>
<text x="360" y="738" fill="#d9534f" font-size="12">Empower: Vial Settings &amp; Fill Mode</text>

<rect x="650" y="610" width="285" height="150" rx="10" fill="#f4f8fd" stroke="#2b7cd3"/>
<circle cx="676" cy="636" r="13" fill="#2b7cd3"/><text x="676" y="641" text-anchor="middle" fill="#fff" font-weight="bold">3</text>
<text x="698" y="641" font-weight="bold" font-size="15">루프 채움 (Loop Fill)</text>
<text x="665" y="670" fill="#444">가압된 헤드스페이스 가스가 프로브</text>
<text x="665" y="690" fill="#444">→ 밸브 → 샘플 루프로 이동,</text>
<text x="665" y="710" fill="#444">남은 가스는 Vent로 배출</text>
<text x="665" y="738" fill="#d9534f" font-size="12">Empower: Loop 온도 / Venting</text>

<rect x="955" y="610" width="285" height="150" rx="10" fill="#fff5f5" stroke="#d9534f"/>
<circle cx="981" cy="636" r="13" fill="#d9534f"/><text x="981" y="641" text-anchor="middle" fill="#fff" font-weight="bold">4</text>
<text x="1003" y="641" font-weight="bold" font-size="15">주입 (Inject)</text>
<text x="970" y="670" fill="#444">밸브 전환 → 캐리어가 루프 내용물을</text>
<text x="970" y="690" fill="#444">밀어 Transfer Line → GC 주입구로</text>
<text x="970" y="710" fill="#444">이송 (Injection Duration 1분)</text>
<text x="970" y="738" fill="#d9534f" font-size="12">Empower: Carrier Control / Times</text>
</g>
<text x="40" y="787" font-size="11" fill="#888">※ 이해를 돕기 위한 개념도입니다. 실제 7697A의 배관·밸브 구성과 다를 수 있으며, 정확한 도면은 Agilent 7697A 매뉴얼을 참고하세요.</text>
</svg>
