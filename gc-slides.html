dth": 24.7, "height": 6.78}}, "makeup": {"title": "🧪 Makeup Flow (N2)", "desc": "질소 메이크업 가스 유량이 25 mL/min으로 설정되어 컬럼 용출 성분의 감도를 보완합니다.", "tip": "피크 밴드 브로드닝을 막고 최적의 감도를 유지합니다.", "region": {"left": 15.41, "top": 53.51, "width": 24.7, "height": 2.62}}, "flame": {"title": "🔥 Flame & Flow Correction", "desc": "Constant Makeup and Fuel Flow 모드가 적용되어 있으며 불꽃(Flame)이 활성화되어 있습니다. 이 모드에서는 오븐 승온에 따라 컬럼 유량이 변하더라도 메이크업 가스와 연료 가스의 합산 유량을 항상 일정하게 유지하여 검출기 감도 변동을 최소화합니다.", "tip": "분석 중 플레임 상태를 항상 모니터링해야 합니다. 필요에 따라 Column+Fuel=Constant, Column+Makeup=Constant 방식으로도 보정 모드를 변경할 수 있습니다.", "region": {"left": 15.09, "top": 57.07, "width": 36.54, "height": 23.19}}}}, {"id": "s6", "title": "Agilent GC: Signal Source & Data Rate", "badge": "📍 Signals", "guide": "👉 신호 소스 및 데이터 수집 속도(Data Rate) 설정을 확인하세요.", "caption": "Agilent 8890 GC Empower Software Control Panel", "aspect": "1255 / 817", "imageKey": "Capture7_2.PNG", "default": "source", "buttons": [{"key": "source", "label": "Signal Source (#1 FID)", "full": false}, {"key": "rate", "label": "Data Rate (20 Hz)", "full": false}, {"key": "save", "label": "Save & Event Table", "full": true}], "params": {"source": {"title": "📡 Signal Source (#1 Front Signal)", "desc": "#1 채널에 Front Signal (FID)이 할당되어 검출기 신호를 데이터로 수집합니다.", "tip": "다중 검출기 사용 시 각 채널별 올바른 신호 소스 매핑이 필수적입니다. 예를 들어 Dual Tower(전/후면 동시 분석) 구성에서는 Channel 1의 Source를 Front Detector, Channel 2의 Source를 Back Detector로 지정해야 신호가 올바르게 매핑됩니다.", "region": {"left": 21.99, "top": 45.65, "width": 23.82, "height": 2.2}}, "rate": {"title": "⚡ Data Rate / Peak Width", "desc": "20 Hz / 0.01 min 설정으로 좁은 피크도 왜곡 없이 정밀하게 샘플링합니다. 단일 채널만 사용하는 경우 최대 200 포인트/초(Hz)까지 설정할 수 있습니다.", "tip": "피크 폭이 좁을수록 높은 Hz 설정이 필요합니다. 다만 여러 채널을 동시에 사용할 때는 전체 데이터 처리 용량에 제약이 있으므로 필요 이상으로 높게 설정하지 않는 것이 좋습니다.", "region": {"left": 47.65, "top": 45.65, "width": 15.3, "height": 2.2}}, "save": {"title": "💾 Save & Event Table", "desc": "해당 채널의 저장(Save) 옵션이 체크되어 있어 크로마토그램 데이터가 정상 기록됩니다.", "tip": "분석 데이터 저장 여부를 반드시 확인하여 데이터 유실을 방지합니다.", "region": {"left": 21.99, "top": 41.62, "width": 50.12, "height": 41.62}}}}, {"id": "s7", "title": "Agilent GC: Configuration Columns", "badge": "📍 Configuration", "guide": "👉 시스템에 구성된 컬럼 장착 상태 및 경로 매핑을 확인하세요.", "caption": "Agilent 8890 GC Empower Software Control Panel", "aspect": "1255 / 841", "imageKey": "Capture8_2.PNG", "default": "installed", "buttons": [{"key": "installed", "label": "Installed Column #1", "full": false}, {"key": "path", "label": "Inlet & Outlet Path", "full": false}], "params": {"installed": {"title": "🧪 Installed Column #1", "desc": "G17-CD624 컬럼이 Back Inlet과 Front Detector 간에 연결된 상태로 구성되어 있습니다.", "tip": "실제 하드웨어 배관과 소프트웨어 구성상의 입·출구 설정이 정확히 일치해야 합니다.", "region": {"left": 17.69, "top": 54.22, "width": 81.12, "height": 3.33}}, "path": {"title": "🔗 Flow Path Mapping", "desc": "Back Inlet -> Column #1 -> Front Detector FID 경로로 구성되어 있습니다. 각 컬럼은 반드시 서로 다른 Inlet에 연결되도록 구성해야 하며, 컬럼을 하나만 사용하더라도 사용하지 않는 컬럼은 다른(미지정이라도) Inlet으로 설정해두어야 합니다.", "tip": "컬럼 교체 시 구성 정보를 업데이트하여 올바른 유량 제어를 보장합니다. 두 컬럼의 Inlet 설정이 겹치면 유량 계산이 비정상적으로 이루어질 수 있으니 주의합니다.", "region": {"left": 14.58, "top": 39.0, "width": 17.29, "height": 3.45}}}}, {"id": "s8", "title": "Agilent GC: GC Readiness Check", "badge": "📍 GC Performance", "guide": "👉 분석 준비 완료(Ready) 상태에 영향을 주는 컴포넌트 설정을 확인하세요.", "caption": "Agilent 8890 GC Empower Software Control Panel", "aspect": "1253 / 849", "imageKey": "Capture9.PNG", "default": "components", "buttons": [{"key": "components", "label": "Checked Components", "full": true}], "params": {"components": {"title": "✔️ GC Readiness Components", "desc": "Oven, Back Inlet (SS Inlet), Front Detector (FID)가 체크되어 있어 해당 부품들이 설정 온도 및 압력에 도달해야만 시스템이 Ready 상태가 됩니다.", "tip": "안정적인 분석 시작을 위해 핵심 파츠들의 안정화 여부를 Readiness 조건에 포함하는 것이 좋습니다.", "region": {"left": 19.63, "top": 43.94, "width": 17.08, "height": 7.89}}}}, {"id": "s9", "title": "Agilent 7697A: Temperatures & Times", "badge": "📍 Headspace Sampler", "guide": "👉 헤드스페이스 샘플러의 온도 및 시간 파라미터를 확인하세요.", "caption": "Agilent 7697A Headspace Control Panel", "aspect": "1259 / 850", "imageKey": "Capture10_2.PNG", "default": "temps", "buttons": [{"key": "temps", "label": "Temperatures (Oven/Loop)", "full": false}, {"key": "times", "label": "Equilibration & Cycle", "full": false}, {"key": "vial", "label": "Vial Settings & Fill Mode", "full": true}], "params": {"temps": {"title": "🌡️ Headspace Temperatures", "desc": "Oven 85 °C, Loop 105 °C, Transfer Line 105 °C로 설정되어 시료의 기화와 이송 중 응축을 방지합니다. Agilent 매뉴얼은 통상 오븐 온도를 용매 비점보다 15 °C 낮게, Transfer Line은 오븐 온도보다 15 °C 높게 잡는 것을 출발점으로 권장합니다.", "tip": "Loop/Valve 온도는 오븐 온도와 같거나 그보다 낮아서는 안 되고, Transfer Line 온도는 Loop/Valve 온도보다 낮아서는 안 됩니다. 이 순서(Oven ≤ Loop/Valve ≤ Transfer Line)를 지켜야 이송 경로 중 시료가 응축되는 것을 막을 수 있습니다.", "region": {"left": 15.57, "top": 15.88, "width": 17.79, "height": 15.29}}, "times": {"title": "⏱️ Times (Equilibration & Cycle)", "desc": "Vial Equilibration 45 min, Injection Duration 1 min, GC Cycle 60 min으로 설정되었습니다. GC Cycle Time은 GC(또는 GC/MS)가 런 종료 후 다시 Ready 상태로 돌아오는 데 걸리는 총 시간을 의미하며, 이 값이 너무 짧으면 시료가 GC보다 먼저 준비되어 Sequence Action 설정에 따라 실행이 중단되거나 예기치 않은 결과가 나올 수 있습니다.", "tip": "Vial Equilibration Time은 값을 모를 경우 최소 15분 이상으로 시작하는 것이 좋고, Pressure Equilibration Time과 Injection Duration의 기본값은 각각 0.50분입니다.", "region": {"left": 46.47, "top": 15.88, "width": 18.27, "height": 15.29}}, "vial": {"title": "🧪 Vial Settings & Fill Mode", "desc": "20 mL 바이알, 18 shakes/min 진탕, Flow to Pressure 15 psi 채움 모드가 적용되었습니다. Fill 압력은 평형 과정에서 자연적으로 형성되는 압력보다 반드시 높게 설정해야 하며, 그렇지 않으면 시료가 오히려 새어 나갈 수 있습니다.", "tip": "진탕(Shaking)은 분배계수(K)가 큰 화합물이나 점도가 높은 액체 시료에서 특히 효과가 큽니다. 바이알 내부 압력이 평형 중 70 kPa(약 10 psi) 미만으로 형성된다면, Fill 압력을 추가로 높여주는 것이 재현성 확보에 도움이 됩니다.", "region": {"left": 14.77, "top": 34.12, "width": 60.68, "height": 36.47}}}}, {"id": "s10", "title": "Agilent 7697A: Advanced Functions & Extraction", "badge": "📍 Advanced Functions", "guide": "👉 추출 모드(Extraction Mode) 및 벤트/퍼지 설정을 확인하세요.", "caption": "Agilent 7697A Headspace Control Panel", "aspect": "1257 / 822", "imageKey": "Capture11_2.PNG", "default": "extraction", "buttons": [{"key": "extraction", "label": "Single Extraction Mode", "full": false}, {"key": "venting", "label": "Venting & Purging", "full": false}], "params": {"extraction": {"title": "🔬 Single Extraction Mode", "desc": "단일 추출(Single Extraction) 방식으로, 바이알을 평형시킨 뒤 한 번만 천공하여 샘플 루프를 채우고(1회 추출) GC로 시료를 주입하면서 런을 시작합니다. 이는 3가지 추출 모드(Single/Multiple/Concentrated) 중 가장 표준적인 방식입니다.", "tip": "Multiple Extractions 모드는 한 번의 바이알 천공으로 여러 번 추출·주입하는 방식으로 반복(kinetic) 실험이나 검량선 작성에 주로 사용되고, Concentrated 모드는 멀티모드 인렛 등 트랩 장치를 이용해 시료를 농축하는 미량 분석에 사용됩니다.", "region": {"left": 14.8, "top": 71.78, "width": 42.32, "height": 10.95}}, "venting": {"title": "💨 Venting and Purging", "desc": "추출 후 바이알 압력 해제(Vent vial pressure after extraction)가 활성화되어 있어, 주입이 진행되는 동안 사용이 끝난 바이알의 잔류 압력을 후면 Vent 포트로 배출합니다. 압력이 남은 바이알이 트레이나 실험실에 그대로 방치되는 것을 방지하기 위한 기능입니다.", "tip": "이와 별도로 Post-injection purge(퍼지 유량 100 mL/min)는 바이알이 바뀔 때마다 샘플 프로브와 샘플 루프, Vent 라인을 고유량으로 씻어내어 이월오염(Carryover)을 줄입니다. 이월오염이 의심되면 퍼지 유량이나 퍼지 시간을 늘려보는 것이 좋습니다.", "region": {"left": 14.8, "top": 85.77, "width": 60.78, "height": 13.38}}}}, {"id": "s11", "title": "Agilent 7697A: Carrier & Purge Controls", "badge": "📍 Carrier Control", "guide": "👉 캐리어 가스 제어 방식 및 퍼지 타임 설정을 확인하세요.", "caption": "Agilent 7697A Headspace Control Panel", "aspect": "1276 / 823", "imageKey": "Capture12_2.PNG", "default": "carrier", "buttons": [{"key": "carrier", "label": "Carrier Control (by GC)", "full": false}, {"key": "purge", "label": "Purge Flow & Time", "full": false}], "params": {"carrier": {"title": "🧪 Carrier Control by GC", "desc": "헤드스페이스의 캐리어 가스는 GC 기기에 의해 통합 제어되도록 설정되어 있습니다(GC Control 모드). 이는 7697A의 기본 설치 방식으로, GC의 EPC 모듈에서 나온 캐리어 가스가 HS 후면의 Carrier 피팅으로 직접 배관되며, 이 모드에서는 HS에 별도의 캐리어 가스 관련 메서드 설정 항목이 없습니다.", "tip": "GC Control 모드에서는 압력 값만 참고용으로 표시되고 유량 값은 계산되지 않습니다. 별도의 7697A Carrier Gas EPC 모듈이 설치된 경우에만 HS Control 또는 GC+HS Control 모드로 전환하여 HS가 직접 캐리어 유량/압력을 제어하도록 구성할 수 있습니다.", "region": {"left": 15.36, "top": 50.43, "width": 58.31, "height": 9.72}}, "purge": {"title": "⏱️ Purge Flow & Time", "desc": "퍼지 유량 100 mL/min, 퍼지 시간 1 min으로 설정되어 있습니다. 이 퍼지는 바이알이 바뀔 때마다 샘플 프로브, 샘플 루프, Vent 라인을 씻어내어 이월오염(Carryover)을 줄이는 역할을 합니다.", "tip": "일반적으로 HS는 퍼지 시간의 앞쪽 절반 동안은 프로브와 Vent를 함께 퍼지하고, 이후 Vent 밸브를 닫아 프로브만 추가로 퍼지합니다(퍼지 시간이 0.1분 미만이면 전체 시간 동안 둘 다 퍼지). 이월오염이 의심되면 퍼지 유량이나 시간을 늘려 잔류 증기를 더 확실히 제거합니다.", "region": {"left": 15.36, "top": 93.56, "width": 23.82, "height": 5.47}}}}, {"id": "s12", "title": "Agilent 7697A: Sequence Actions", "badge": "📍 Sequence Actions", "guide": "👉 시퀀스 실행 중 오류 발생 시 대응 동작 설정을 확인하세요.", "caption": "Agilent 7697A Headspace Control Panel", "aspect": "1271 / 792", "imageKey": "Capture13_2.PNG", "default": "actions", "buttons": [{"key": "actions", "label": "Sequence Exception Actions", "full": false}, {"key": "dev", "label": "Method Development", "full": false}], "params": {"actions": {"title": "⚠️ Sequence Exception Actions", "desc": "Vial Missing 시 Pause, Wrong Vial Size / Leak Detected / System Not Ready 시 Continue로 예외 처리가 설정되어 있습니다. 각 항목에는 Continue(계속 진행), Skip(해당 바이알만 건너뛰고 다음으로 진행), Pause(시퀀스 일시정지), Abort(전체 시퀀스 중단 및 모든 바이알 트레이 반환) 중 상황에 맞는 동작을 지정할 수 있습니다.", "tip": "HS는 바이알 높이로 크기를 판별하기 때문에 20 mL와 22 mL 바이알을 구분하지 못합니다. 또한 Leak Detected는 Dynamic Leak Test(기본 허용 누출률 2 mL/min) 결과에 따라 동작하며, System Not Ready는 HS가 준비된 후에도 GC가 아직 Ready 상태가 아닐 때 발생합니다. MS/MSD 연동 시에는 Check for Ready 항목에 Continue 대신 Abort나 Skip을 선택하는 것이 데이터 유실 방지에 안전합니다.", "region": {"left": 14.48, "top": 28.41, "width": 22.9, "height": 20.83}}, "dev": {"title": "🛠️ Method Development", "desc": "Manual 항목의 Parameter Increment 기능은 연속되는 런마다 오븐 온도, Vial Equilibration Hold Time, 또는 Vial Shaking 레벨을 지정한 값만큼 자동으로 증가시켜, 최적의 평형 조건을 실험적으로 찾는 데 사용합니다. Assisted 항목은 특정 애플리케이션 기반 메서드 생성이나 기존 Valve & Loop/Pressure Transfer 방식 헤드스페이스 메서드를 변환하는 마법사 기능을 제공합니다.", "tip": "오븐 온도를 증가시킬 때는 모든 가열 구간(오븐/루프/전송선)이 동일한 비율로 함께 증가하며, 특정 구간이 최고 허용 온도에 도달하면 그 이후로는 최고 온도에서 유지됩니다. 온도 증가 대신 평형 시간을 늘리면 시료 분해 없이 더 많은 분석물을 추출하는 데 도움이 될 수 있습니다.", "region": {"left": 14.48, "top": 58.71, "width": 36.27, "height": 39.77}}}}, {"id": "s13", "title": "Agilent Empower: Instrument Configuration", "badge": "📍 Instrument Configuration", "guide": "👉 소프트웨어와 연동된 하드웨어 장비 구성 및 네트워크 등록 상태를 확인하세요.", "caption": "Empower Software System Configuration Panel", "aspect": "1276 / 852", "imageKey": "Capture14_2.PNG", "default": "modules", "buttons": [{"key": "modules", "label": "Configured Modules", "full": false}, {"key": "auto", "label": "Auto Configure", "full": false}], "params": {"modules": {"title": "🖥️ Configured Modules (GC & HS)", "desc": "Agilent 8890 GC(시리얼: CN2411A079)와 7697A Headspace(시리얼: CN24061035)가 소프트웨어 시스템에 정상적으로 구성 및 등록되어 있습니다.", "tip": "다중 모듈 연동 시 각 장비의 통신 주소와 모듈 순서가 올바르게 매핑되어야 데이터 제어가 정상 작동합니다.", "region": {"left": 76.02, "top": 3.52, "width": 23.51, "height": 3.29}}, "auto": {"title": "⚙️ Auto Configure & Management", "desc": "우측 하단의 Configure, Clear, Up/Down 버튼을 통해 장비 추가, 삭제 및 구성을 관리할 수 있습니다.", "tip": "하드웨어 변경이나 유지보수 후 시스템 구성을 갱신할 때 사용합니다.", "region": {"left": 61.91, "top": 42.25, "width": 37.62, "height": 54.58}}}}, {"id": "s14", "title": "Agilent Empower: Options & Preferences", "badge": "📍 Options", "guide": "👉 처리 효율성 옵션 및 주입기 우선순위 설정을 확인하세요.", "caption": "Empower Software Options Control Panel", "aspect": "1274 / 845", "imageKey": "Capture15_2.PNG", "default": "throughput", "buttons": [{"key": "throughput", "label": "High Throughput", "full": false}, {"key": "injector", "label": "Injector Preference", "full": false}], "params": {"throughput": {"title": "⚡ High Throughput Option", "desc": "High Throughput 옵션이 활성화되어 있어 다중 시료 연속 분석 시 대기 시간을 단축하고 처리 효율을 극대화합니다.", "tip": "다량의 시료 분석 시 오븐 오버랩 및 준비 동작을 최적화하여 전체 분석 소요 시간을 줄여줍니다.", "region": {"left": 4.32, "top": 8.88, "width": 28.42, "height": 11.24}}, "injector": {"title": "💉 Injector Preference", "desc": "AgHSSHeadspace가 기본 주입기로 선택되어 있어 헤드스페이스 샘플러를 통한 시료 주입이 우선 적용됩니다.", "tip": "시스템에 장착된 메인 주입 장치와 일치하도록 정확한 인젝터를 선택해야 합니다.", "region": {"left": 4.32, "top": 24.26, "width": 28.42, "height": 13.61}}}}, {"id": "s15", "title": "Agilent GC: Columns (Control Mode)", "badge": "📍 Configuration - Columns", "guide": "👉 컬럼의 유량 제어 모드와 계산된 유체역학적 파라미터를 확인하세요.", "caption": "Agilent 8890 GC Empower Software Control Panel", "aspect": "1270 / 830", "imageKey": "Capture3.PNG", "default": "controlmode", "buttons": [{"key": "controlmode", "label": "Control Mode (On)", "full": false}, {"key": "flow", "label": "Flow (1.095 mL/min)", "full": false}, {"key": "pressure", "label": "Pressure (5.2953 psi)", "full": false}, {"key": "velocity", "label": "Average Velocity", "full": false}, {"key": "holdup", "label": "Holdup Time", "full": false}, {"key": "flowmode", "label": "Constant Flow 모드", "full": false}, {"key": "info", "label": "초기 조건 정보", "full": false}, {"key": "postrun_config", "label": "Post Run & Column #1 Configuration", "full": true}], "params": {"controlmode": {"title": "🎛️ Control Mode (On)", "desc": "컬럼의 유량 제어 기능이 On으로 활성화되어 있어, 아래 Setpoint 값들에 따라 컬럼 유량이 소프트웨어적으로 제어됩니다.", "tip": "제어가 꺼져 있으면 이하의 Flow/Pressure 등 계산값이 실제 컬럼에 적용되지 않으니 항상 On 상태를 확인합니다.", "region": {"left": 42.91, "top": 43.13, "width": 5.91, "height": 2.41}}, "flow": {"title": "💨 Flow (컬럼 유량)", "desc": "컬럼을 통과하는 운반 가스의 유량이 1.095 mL/min으로 설정되어 있습니다. 분리능과 분석 시간에 직접적인 영향을 줍니다.", "tip": "컬럼 내경과 길이에 맞는 최적 선속도 범위 내에서 유량을 설정해야 이론단수가 극대화됩니다.", "region": {"left": 42.91, "top": 46.14, "width": 19.29, "height": 2.65}}, "pressure": {"title": "📊 Pressure (컬럼 헤드 압력)", "desc": "설정된 유량을 만들기 위해 필요한 컬럼 입구 압력이 5.2953 psi로 계산되어 표시됩니다.", "tip": "Flow 값을 바꾸면 이 압력 값도 자동으로 재계산됩니다.", "region": {"left": 42.91, "top": 49.16, "width": 19.29, "height": 2.65}}, "velocity": {"title": "🚀 Average Velocity (평균 선속도)", "desc": "컬럼 내 운반 가스의 평균 선속도가 20.498 cm/sec로 계산되어 있습니다. 분리 효율(이론단수)과 밀접한 관련이 있습니다.", "tip": "일반적으로 헬륨 기준 20~40 cm/sec 범위가 효율적인 분리에 권장됩니다.", "region": {"left": 42.91, "top": 52.29, "width": 19.29, "height": 2.65}}, "holdup": {"title": "⏳ Holdup Time (체류 시간)", "desc": "운반 가스가 컬럼 입구에서 출구까지 이동하는 데 걸리는 시간(t     let currentIndex = 0;

    const els = {
    let currentHighlight = null;
        title: document.getElementById('slide-title'),
        badge: document.getElementById('slide-badge'),
        guide: document.getElementById('slide-guide'),
        caption: document.getElementById('slide-caption'),
        img: document.getElementById('gc-screenshot'),
        box: document.getElementById('gc-image-box'),
        highlight: document.getElementById('highlight-box'),
        buttons: document.getElementById('grid-buttons'),
        detTitle: document.getElementById('det-title'),
        detDesc: document.getElementById('det-desc'),
        detTip: document.getElementById('det-tip'),
        prev: document.getElementById('btn-prev'),
        next: document.getElementById('btn-next'),
    };

    function applyHighlight(region) {
        els.highlight.style.left = region.left + '%';
        els.highlight.style.top = region.top + '%';
        els.highlight.style.width = region.width + '%';
        els.highlight.style.height = region.height + '%';
        els.highlight.classList.remove('show');
        void els.highlight.offsetWidth;
        els.highlight.classList.add('show');
    }

    function selectParam(slide, key, btnEl) {
        currentHighlight = slide.params[key].region;
        els.buttons.querySelectorAll('.param-btn').forEach(b => b.classList.remove('active'));
        if (btnEl) btnEl.classList.add('active');

        const data = slide.params[key];
        els.detTitle.innerText = data.title;
        els.detDesc.innerText = data.desc;
        els.detTip.innerHTML = `<strong>설정 팁:</strong> ${data.tip}`;
        applyHighlight(data.region);
    }

    function loadSlide(index) {
        currentIndex = ((index % SLIDES.length) + SLIDES.length) % SLIDES.length;
        const slide = SLIDES[currentIndex];

        els.title.innerText = slide.title;
        els.badge.innerText = slide.badge;
        els.guide.innerText = slide.guide;
        els.caption.innerText = slide.caption;
        els.box.style.aspectRatio = slide.aspect;
        els.img.src = 'data:image/png;base64,' + IMAGES[slide.imageKey];
n        els.img.onload = () => {
            if (currentHighlight) applyHighlight(currentHighlight);
        };

        els.buttons.innerHTML = '';
        slide.buttons.forEach(btn => {
            const el = document.createElement('button');
            el.className = 'param-btn' + (btn.full ? ' full-width' : '') + (btn.key === slide.default ? ' active' : '');
            el.innerHTML = btn.label + ' <span>&gt;</span>';
            el.onclick = () => selectParam(slide, btn.key, el);
            els.buttons.appendChild(el);
        });

        selectParam(slide, slide.default, els.buttons.querySelector('.param-btn.active'));

        document.querySelectorAll('.nav-item').forEach((el, i) => {
            el.classList.toggle('active', i === currentIndex);
        });
        const activeNav = document.querySelector('.nav-item.active');
        if (activeNav) activeNav.scrollIntoView({ block: 'nearest' });

        els.prev.disabled = false;
        els.next.disabled = false;
    }

    function prevSlide() { loadSlide(currentIndex - 1); }
    function nextSlide() { loadSlide(currentIndex + 1); }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') prevSlide();
        if (e.key === 'ArrowRight') nextSlide();
    });

    window.addEventListener('DOMContentLoaded', () => loadSlide(0));
</script>
